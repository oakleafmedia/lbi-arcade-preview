<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>LBI Arcade Preview</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0f14; color: #e8edf2; font: 15px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  form { background: #151b23; border: 1px solid #2a3442; border-radius: 12px; padding: 22px; width: min(360px, 100%); }
  h1 { font-size: 18px; margin: 0 0 4px; } p { color: #8d99a6; margin: 0 0 14px; font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 11px; border-radius: 8px; border: 1px solid #2a3442; background: #0b0f14; color: #e8edf2; font-size: 16px; }
  button { margin-top: 10px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #9dff5a; color: #0b0f14; font-weight: 800; font-size: 15px; cursor: pointer; }
  .err { color: #ff8a3a; min-height: 20px; margin: 8px 0 0; font-size: 13px; }
  .links { display: none; } .links a { display: block; margin-top: 10px; padding: 11px; border-radius: 8px; background: #24303d; color: #fff; text-decoration: none; text-align: center; font-weight: 700; }
</style></head><body>
<form id="f"><h1>LBI Arcade preview</h1><p>Private preview. Enter the password.</p>
<input id="pw" type="password" autocomplete="current-password" aria-label="Password" autofocus><button>Open</button><p class="err" id="err"></p>
<div class="links" id="links"><a href="app/lab/deep-drop/">Surf Fishing Classic</a><a href="app/lab/deep-drop/?present=1">Surf Fishing Classic (TV mode)</a><a href="app/lab/deep-drop/approve/">Art approval board</a><a href="#" id="lock" style="background:none;color:#8d99a6;font-weight:500">Lock this browser</a></div>
</form>
<script>
const $ = (id) => document.getElementById(id);
const store = (k) => new Promise((res, rej) => { const r = indexedDB.open('sfc-gate', 1); r.onupgradeneeded = () => r.result.createObjectStore('k');
  r.onsuccess = () => { const tx = r.result.transaction('k', 'readwrite'); k ? tx.objectStore('k').put(k, 'key') : tx.objectStore('k').delete('key'); tx.oncomplete = res; tx.onerror = rej; }; r.onerror = rej; });
async function unlocked() {
  $('pw').style.display = 'none'; document.querySelector('#f button').style.display = 'none'; document.querySelector('#f p').textContent = 'Unlocked on this browser.'; $('links').style.display = 'block';
}
async function boot() {
  if (!('serviceWorker' in navigator) || !crypto.subtle) { $('err').textContent = 'This browser can\'t open the preview. Try Chrome or Safari.'; return; }
  await navigator.serviceWorker.register('sw.js', { scope: './' }); await navigator.serviceWorker.ready;
  const has = await new Promise((res) => { const r = indexedDB.open('sfc-gate', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => { const g = r.result.transaction('k').objectStore('k').get('key'); g.onsuccess = () => res(!!g.result); g.onerror = () => res(false); }; r.onerror = () => res(false); });
  if (has) unlocked();
}
$('f').addEventListener('submit', async (e) => {
  e.preventDefault(); $('err').textContent = 'Checking…';
  try {
    const kdf = await (await fetch('kdf.json', { cache: 'no-cache' })).json();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('pw').value), 'PBKDF2', false, ['deriveKey']);
    const salt = new Uint8Array(kdf.salt.match(/../g).map((h) => parseInt(h, 16)));
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: kdf.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const b = new Uint8Array(await (await fetch('e/m', { cache: 'no-cache' })).arrayBuffer());
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, key, b.slice(12)); // throws on a wrong password
    await store(key); (await navigator.serviceWorker.ready).active.postMessage({ key });
    $('err').textContent = ''; location.href = 'app/lab/deep-drop/';
  } catch (err) { $('err').textContent = 'Wrong password.'; }
});
$('lock').addEventListener('click', async (e) => { e.preventDefault(); await store(null); (await navigator.serviceWorker.ready).active.postMessage('lock'); location.reload(); });
boot();
</script></body></html>
